<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src https:">
  <title>Peek-a-boo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="island" data-state="idle" data-media="none">
    <div class="pill-face" aria-hidden="true">
      <span class="dot"></span>
      <span class="bars"><i></i><i></i><i></i><i></i></span>
    </div>

    <div class="card-face">
      <div class="stage">
        <canvas id="video"></canvas>
        <div class="artwork">
          <img id="artwork-bg" alt="">
          <img id="artwork" alt="">
        </div>
        <div class="empty">
          <span class="dot"></span>
          <p>Play a video on YouTube in Chrome</p>
        </div>
        <div class="paused-badge" aria-label="Paused">
          <svg viewBox="0 0 24 24" width="12" height="12"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>
        </div>
      </div>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
